<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Organ | AR Organ Tubuh</title>
  <meta name="description" content="Lihat model 3D organ tubuh manusia, hotspot anatomi interaktif, dan fitur Augmented Reality (AR).">
  <meta property="og:title" content="Detail Organ | AR Organ Tubuh">
  <meta property="og:description" content="Eksplorasi bagian organ tubuh manusia dalam 3D dan Augmented Reality.">
  <meta property="og:image" content="img/jantung.webp">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <script>try{const t=localStorage.getItem("ar-organ-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container detail-header">
      <a class="back-link" href="index.html">&larr; Kembali</a>
      <div class="detail-header-right">
        <span class="brand-name">AR Organ Tubuh</span>
        <button id="theme-toggle" class="btn-theme" type="button" aria-label="Ubah tema">Gelap</button>
      </div>
    </div>
  </header>

  <main class="container detail-main">
    <section class="viewer-section">
      <model-viewer
        id="mv"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        loading="eager"
        reveal="auto">
        <button slot="ar-button" class="btn-ar">Lihat di AR</button>
        <div slot="progress-bar" class="progress">
          <div class="progress-fill"></div>
        </div>
      </model-viewer>
      <p class="ar-note">Fitur AR tersedia di HP Android/iPhone yang didukung. Klik titik pada model untuk info bagian organ.</p>
      <section id="sim-panel" class="sim-panel" hidden>
        <div class="sim-header">
          <div class="sim-title-wrap">
            <span id="sim-dot" class="sim-dot" aria-hidden="true"></span>
            <h2 id="sim-title" class="sim-title">Simulasi</h2>
          </div>
          <span id="sim-rate" class="sim-rate"></span>
        </div>
        <div class="sim-controls">
          <button id="sim-toggle" class="sim-btn sim-btn-primary" type="button">Mulai Simulasi</button>
          <button id="sim-mode-rest" class="sim-btn is-active" type="button">Istirahat</button>
          <button id="sim-mode-active" class="sim-btn" type="button">Olahraga</button>
          <button id="sim-sound" class="sim-btn" type="button" aria-pressed="true">Suara: Aktif</button>
        </div>
        <p id="sim-status" class="sim-status" aria-live="polite"></p>
      </section>
      <aside id="info" class="hotspot-info" aria-live="polite" hidden>
        <div class="hotspot-info-header">
          <h2 id="info-title"></h2>
          <button id="info-close" class="hotspot-info-close" type="button" aria-label="Tutup panel info">&times;</button>
        </div>
        <p id="info-text"></p>
      </aside>
    </section>

    <article class="detail-info">
      <div class="detail-title-row">
        <h1 id="nama"></h1>
        <button id="btn-tts" class="btn-tts" type="button" aria-pressed="false" aria-label="Bacakan informasi organ">Bacakan</button>
      </div>
      <p id="deskripsi" class="detail-desc"></p>

      <h2>Fungsi</h2>
      <ul id="fungsi" class="detail-list"></ul>

      <div class="fact-box">
        <h2>Fakta Menarik</h2>
        <p id="fakta"></p>
      </div>

      <h2>Gangguan &amp; Penyakit Umum</h2>
      <div id="penyakit" class="disease-list"></div>

      <div class="tips-box">
        <h2>Cara Menjaga Kesehatan</h2>
        <ul id="tips-sehat" class="detail-list"></ul>
      </div>

      <div class="detail-actions">
        <a id="link-kuis" class="btn-quiz" href="#">Ikut kuis organ ini</a>
      </div>

      <section id="kredit" class="credit-box"></section>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>AR Organ Tubuh &mdash; Media Edukasi Anatomi 3D</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
