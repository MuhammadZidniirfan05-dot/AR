<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Anatomi | AR Organ Tubuh</title>
  <meta name="description" content="Uji pengetahuanmu tentang anatomi dan fungsi organ tubuh manusia melalui kuis interaktif.">
  <meta property="og:title" content="Kuis Anatomi | AR Organ Tubuh">
  <meta property="og:description" content="Kuis singkat seputar fungsi dan fakta organ tubuh manusia.">
  <meta property="og:image" content="img/jantung.webp">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <script>try{const s=localStorage.getItem("ar-organ-theme");const t=(s==="dark"||s==="sepia"||s==="light")?s:(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container detail-header">
      <a class="back-link" href="index.html" data-i18n="backToList">&larr; Kembali ke Daftar</a>
      <div class="detail-header-right">
        <span class="brand-name" data-i18n="brandQuiz">Kuis AR Organ Tubuh</span>
        <button id="lang-toggle" class="btn-lang" type="button" aria-label="Ganti ke Bahasa Inggris">EN</button>
        <button id="theme-toggle" class="btn-theme" type="button" aria-label="Ubah tema">Sepia</button>
      </div>
    </div>
  </header>

  <main class="container quiz-main">
    <section id="quiz-card" class="quiz-card">
      <div class="quiz-top">
        <span id="quiz-mode" class="quiz-mode"></span>
        <span id="quiz-progress" class="quiz-progress"></span>
      </div>
      <div class="quiz-bar" aria-hidden="true">
        <div id="quiz-bar-fill" class="quiz-bar-fill"></div>
      </div>

      <h1 id="quiz-question" class="quiz-question"></h1>
      <div id="quiz-options" class="quiz-options"></div>

      <div id="quiz-feedback" class="quiz-feedback" hidden>
        <p id="quiz-status" class="quiz-status"></p>
        <p id="quiz-explanation" class="quiz-explanation"></p>
        <button id="quiz-next" class="btn-quiz" type="button">Lanjut</button>
      </div>
    </section>

    <section id="quiz-result" class="quiz-card quiz-result" hidden>
      <h1 data-i18n="quizResultHeading">Hasil Kuis</h1>
      <p id="result-score" class="result-score"></p>
      <p id="result-high-score" class="result-high-score"></p>
      <div class="result-actions">
        <button id="quiz-retry" class="btn-quiz" type="button" data-i18n="quizRetry">Ulangi</button>
        <a class="btn-secondary" href="index.html" data-i18n="quizBackList">Kembali ke daftar</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="commonFooter">AR Organ Tubuh &mdash; Media Edukasi Anatomi 3D</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
